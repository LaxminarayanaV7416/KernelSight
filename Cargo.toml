[workspace]
resolver = "3"
members = ["proc-parser"]

[package]
name = "perf_insight_lite"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
basic-toml = { version = "0.1.10", features = [] }
libc = { version = "0.2.189", features = [] }

[build]
rustflags = ["-C", "target-cpu=native"]

[profile.dev]
debug = true
opt-level = 3

[profile.release]
debug = true
opt-level = 3

[dependencies]
proc-parser = { path = "./proc-parser" }
serde = { workspace = true }
basic-toml = { workspace = true }
libc = { workspace = true }
signal-hook = "0.4.4"
